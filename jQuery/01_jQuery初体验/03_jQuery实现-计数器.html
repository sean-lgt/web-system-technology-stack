<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button class="sub">-</button>
    <span class="counter">0</span>
    <button class="add">+</button>

    <script src="../libs/jquery-3.6.0.js"></script>
    <script>
      const $sub = $('sub')
      const $span = $('.counter')
      const $add = $('.add')
      const counter = 0

      $sub.on('click', () => {
        $span.text(--counter)
      })

      $add.on('click', () => {
        $span.text(++counter)
      })
    </script>
  </body>
</html>
