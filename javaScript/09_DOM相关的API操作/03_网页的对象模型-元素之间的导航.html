<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 我是注释, 哈哈哈 -->
    我是文本, 呵呵呵

    <div class="box">哈哈哈哈哈</div>
    <ul>
      <li>1</li>
      <li>2</li>
      <li>3</li>
      <li>4</li>
      <li>5</li>
    </ul>

    <script>
      var bodyEl = document.body
      // 根据body元素去获取子元素（element）
      var childElements = bodyEl.children
      console.log(childElements)

      // 获取 box 元素
      var boxEl1 = document.firstElementChild
      var boxEl2 = bodyEl.children[0]
      console.log('🚀【boxEl1】', boxEl1)
      console.log('🚀【boxEl2】', boxEl2)
      console.log('==', boxEl1 === boxEl2)

      // 获取 ul 元素
      var ulEl = boxEl1.nextElementSibling
      console.log('🚀【ulEl】', ulEl)

      // 获取 li 元素
      var liEls = ulEl.children
      console.log('🚀【liEls】', liEls)
    </script>
  </body>
</html>
