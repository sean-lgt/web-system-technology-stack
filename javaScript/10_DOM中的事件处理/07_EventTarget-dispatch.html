<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // eventtarget就可以实现类似于事件总线的效果
      window.addEventListener('eventBus', function () {
        console.log('监听到eventBus的呼唤~')
      })

      setTimeout(function () {
        window.dispatchEvent(new Event('eventBus'))
      }, 5000)
    </script>
  </body>
</html>
