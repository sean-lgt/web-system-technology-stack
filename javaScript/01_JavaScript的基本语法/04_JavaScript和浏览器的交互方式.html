<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 1.交互方式一：alert函数
      alert('hello')

      // 2.交互方式二：console.log函数，将内容输出到控制台中
      console.log('hello')

      // 3.交互方式三：document.write函数，将内容输出到网页中
      document.write('hello')

      // 4.交互方式四：window.prompt函数，弹出对话框，让用户输入内容
      const result = prompt('请输入内容')
      alert('您刚才输入的内容是：' + result)
    </script>
  </body>
</html>
