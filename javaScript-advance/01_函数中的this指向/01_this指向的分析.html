<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 定义函数
      function foo(name) {
        console.log('foo 函数:', this)
      }

      // 方式一：直接调用
      foo()

      // 方式二：对象调用
      var obj = {
        name: 'obj',
        foo: foo,
      }

      obj.foo()
    </script>
  </body>
</html>
