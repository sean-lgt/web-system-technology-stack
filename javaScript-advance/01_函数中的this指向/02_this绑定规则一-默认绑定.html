<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 定义函数
      // 普通函数被掉用户
      function foo() {
        console.log('foo:', this)
      }
      foo()

      // 函数在对象中，但是可以独立调用
      var obj = {
        name: 'why',
        bar: function () {
          console.log('bar:', this)
        },
      }
      var baz = obj.bar
      baz()

      // 高阶函数，函数作为参数传入函数
      function test(fn) {
        fn()
      }

      test(obj.bar)

      // "use strict"
      // 严格模式下, 独立调用的函数中的this指向的是undefined
    </script>
  </body>
</html>
