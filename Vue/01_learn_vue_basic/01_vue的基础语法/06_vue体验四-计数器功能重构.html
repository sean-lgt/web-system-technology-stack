<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <div id="app">
        <h2>当前计数: {{counter}}</h2>
        <button @click="increment">+1</button>
        <button @click="decrement">-1</button>
      </div>
    </div>

    <script src="../libs/vue@3.5.13.js"></script>

    <script>
      const app = Vue.createApp({
        data: function () {
          return {
            counter: 0,
          }
        },
        methods: {
          increment: function () {
            this.counter++
          },
          decrement: function () {
            this.counter--
          },
        },
      })
      app.mount('#app')
    </script>
  </body>
</html>
