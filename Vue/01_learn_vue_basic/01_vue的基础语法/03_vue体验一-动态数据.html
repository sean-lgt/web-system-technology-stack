<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- CDN 地址 -->
    <script src="../libs/vue@3.5.13.js"></script>

    <script>
      const app = Vue.createApp({
        // 插值语法: {{title}}
        template: `<h2>{{message}}</h2>`,
        data: function () {
          return {
            title: 'Hello World',
            message: '你好啊, Vue3',
          }
        },
      })
      app.mount('#app')
    </script>
  </body>
</html>
