    <script type="text/babel">
      class App extends React.Component {
        // 组件数据
        constructor() {
          super()
          this.state = {
            message: 'hello world',
            name: 'test',
            age: 18,
          }

          // 对需要绑定的方法，需要提前绑定好this
          this.btnClick = this.btnClick.bind(this)
        }

        // 组件方法（实例方法）
        btnClick() {
          // 内部完成两件事 修改state数据 自动执行render渲染函数
          this.setState({
            message: 'hello react',
          })
        }

        // 渲染内容  render方法
        render() {
          return (
            <div>
              <h2>{this.state.message}</h2>
              <button onClick={this.btnClick}>修改文本</button>
            </div>
          )
        }
      }

      // 将组件渲染到界面上
      const root = ReactDOM.createRoot(document.querySelector('#root'))
      // App根组件
      root.render(<App />)
    </script>
  </body>
